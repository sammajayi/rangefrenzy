specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MarketFactory
    network: celo
    source:
      address: "0x73448cE25EEf5E3E9c092D880371Aba892fB3447"
      abi: MarketFactory
      startBlock: 70488827
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - Market
        - MarketRange
      abis:
        - name: MarketFactory
          file: ./abis/MarketFactory.json
        - name: RangeFrenzyMarket
          file: ./abis/RangeFrenzyMarket.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed address,string,uint8,uint256,uint256,uint256)
          handler: handleMarketCreated
      file: ./src/market-factory.ts

templates:
  - kind: ethereum
    name: RangeFrenzyMarket
    network: celo
    source:
      abi: RangeFrenzyMarket
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - Market
        - Stake
        - Transaction
      abis:
        - name: RangeFrenzyMarket
          file: ./abis/RangeFrenzyMarket.json
      eventHandlers:
        - event: Staked(indexed address,indexed uint256,uint256,uint256,uint256,uint256)
          handler: handleStaked
        - event: PositionSold(indexed address,indexed uint256,uint256,uint256,uint256)
          handler: handlePositionSold
        - event: BettingClosed(uint256)
          handler: handleBettingClosed
        - event: MarketResolved(uint256,uint256[],uint256,uint256)
          handler: handleMarketResolved
        - event: WinningsClaimed(indexed address,uint256)
          handler: handleWinningsClaimed
        - event: StakeRefunded(indexed address,uint256)
          handler: handleStakeRefunded
        - event: MarketCancelled(string,uint256)
          handler: handleMarketCancelled
      file: ./src/market.ts
