<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07955F" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#0A1118" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="160" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07955F" stop-opacity="0"/>
      <stop offset="20%" stop-color="#07955F" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#07955F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#07955F" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#07955F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#07955F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A1118"/>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#07955F" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Large decorative left bracket -->
  <line x1="68" y1="90" x2="68" y2="540" stroke="#07955F" stroke-width="4.5" stroke-linecap="round" opacity="0.18"/>
  <line x1="68" y1="90" x2="120" y2="90" stroke="#07955F" stroke-width="3.5" stroke-linecap="round" opacity="0.18"/>
  <line x1="68" y1="540" x2="120" y2="540" stroke="#07955F" stroke-width="3.5" stroke-linecap="round" opacity="0.18"/>

  <!-- Large decorative right bracket -->
  <line x1="1132" y1="90" x2="1132" y2="540" stroke="#07955F" stroke-width="4.5" stroke-linecap="round" opacity="0.18"/>
  <line x1="1132" y1="90" x2="1080" y2="90" stroke="#07955F" stroke-width="3.5" stroke-linecap="round" opacity="0.18"/>
  <line x1="1132" y1="540" x2="1080" y2="540" stroke="#07955F" stroke-width="3.5" stroke-linecap="round" opacity="0.18"/>

  <!-- Bonding curve chart line -->
  <polyline
    points="160,500 260,460 380,420 500,390 620,370 740,356 860,346 980,340 1100,336"
    stroke="url(#curveGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Range zone highlight on the curve -->
  <rect x="560" y="330" width="220" height="80" rx="10" fill="#07955F" opacity="0.07"/>
  <line x1="560" y1="320" x2="560" y2="420" stroke="#07955F" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="780" y1="320" x2="780" y2="420" stroke="#07955F" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <!-- Prediction dot on curve -->
  <circle cx="670" cy="362" r="10" fill="#07955F" opacity="0.25"/>
  <circle cx="670" cy="362" r="6" fill="#07955F"/>
  <circle cx="670" cy="362" r="2.5" fill="white" opacity="0.9"/>

  <!-- Logo mark (48x48 scaled 2.4x → ~115x115) -->
  <g transform="translate(148, 158) scale(2.4)">
    <rect width="48" height="48" rx="10" fill="#0D1420"/>
    <rect x="13" y="17" width="22" height="14" rx="2.5" fill="#07955F" opacity="0.15"/>
    <line x1="14" y1="16" x2="14" y2="32" stroke="#07955F" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="14" y1="16" x2="18" y2="16" stroke="#07955F" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <line x1="14" y1="32" x2="18" y2="32" stroke="#07955F" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <line x1="34" y1="16" x2="34" y2="32" stroke="#07955F" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="34" y1="16" x2="30" y2="16" stroke="#07955F" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <line x1="34" y1="32" x2="30" y2="32" stroke="#07955F" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <polyline points="15,31 19,27.5 24,24 29,21.5 33,20" stroke="#07955F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
    <circle cx="24" cy="24" r="4" fill="#07955F"/>
    <circle cx="24" cy="24" r="1.8" fill="white" opacity="0.92"/>
  </g>

  <!-- "RangeFrenzy" wordmark -->
  <text x="290" y="243"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="78" font-weight="900" fill="white" letter-spacing="-2">
    RangeFrenzy
  </text>

  <!-- Tagline -->
  <text x="292" y="300"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="27" fill="rgba(255,255,255,0.52)" letter-spacing="0.3">
    Predict outcome ranges. Stake G$. Win big.
  </text>

  <!-- Category pills -->
  <rect x="290" y="334" width="116" height="34" rx="17" fill="#07955F" opacity="0.18" stroke="#07955F" stroke-width="1" stroke-opacity="0.4"/>
  <text x="348" y="356" font-family="system-ui, sans-serif" font-size="14" fill="#07955F" text-anchor="middle" font-weight="700">Crypto</text>

  <rect x="418" y="334" width="108" height="34" rx="17" fill="#07955F" opacity="0.1" stroke="#07955F" stroke-width="1" stroke-opacity="0.25"/>
  <text x="472" y="356" font-family="system-ui, sans-serif" font-size="14" fill="#07955F" text-anchor="middle" font-weight="700" opacity="0.8">Sports</text>

  <rect x="538" y="334" width="100" height="34" rx="17" fill="#07955F" opacity="0.1" stroke="#07955F" stroke-width="1" stroke-opacity="0.25"/>
  <text x="588" y="356" font-family="system-ui, sans-serif" font-size="14" fill="#07955F" text-anchor="middle" font-weight="700" opacity="0.8">Local</text>

  <!-- Bottom attribution -->
  <text x="290" y="550"
    font-family="system-ui, sans-serif"
    font-size="17" fill="rgba(255,255,255,0.28)" letter-spacing="0.4">
    Powered by Celo · G$ Universal Basic Income
  </text>
</svg>
